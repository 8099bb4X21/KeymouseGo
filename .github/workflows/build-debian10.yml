name: 构建 UOS 20 ARM64 包

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: 在 ARM64 Debian 10 容器内编译
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            debian:10-slim \
            bash -c '
              set -e

              # 切换为归档源（Debian 10 已 EOL）
              sed -i "s/deb\.debian\.org/archive.debian.org/g" /etc/apt/sources.list
              sed -i "s|security.debian.org|archive.debian.org/debian-security|g" /etc/apt/sources.list
              sed -i "s|deb.debian.org/debian-security|archive.debian.org/debian-security|g" /etc/apt/sources.list 2>/dev/null || true
              sed -i "/buster-updates/s/^/# /" /etc/apt/sources.list

              apt-get update
              apt-get install -y --no-install-recommends \
                git wget ca-certificates \
                linux-libc-dev build-essential \
                libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

              # Miniforge ARM64
              wget -q https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-aarch64.sh -O /tmp/miniforge.sh
              bash /tmp/miniforge.sh -b -p /opt/conda
              /opt/conda/bin/conda create -n build python=3.11 -y

              /opt/conda/envs/build/bin/pip install --upgrade pip
              sed -i "/PySide6/d" requirements-universal.txt
              /opt/conda/envs/build/bin/pip install -r requirements-universal.txt
              /opt/conda/bin/conda install -n build -c conda-forge pyside6 -y
              /opt/conda/envs/build/bin/pip install qt-material==2.11 --no-deps
              /opt/conda/envs/build/bin/pip install pyinstaller

              # 原生 ARM64 下 ldd 正常工作，PyInstaller 可自动解析 Qt6 依赖
              export LD_LIBRARY_PATH=/opt/conda/envs/build/lib:$LD_LIBRARY_PATH
              /opt/conda/envs/build/bin/pyinstaller -F -w \
                --add-data "./assets:assets" \
                --hidden-import "PySide6" \
                --hidden-import "PySide6.QtCore" \
                --hidden-import "PySide6.QtGui" \
                --hidden-import "PySide6.QtWidgets" \
                --hidden-import "PySide6.QtMultimedia" \
                --hidden-import "pynput.keyboard._xorg" \
                --hidden-import "pynput.keyboard._uinput" \
                --hidden-import "pynput.mouse._xorg" \
                --hidden-import "pynput.mouse._uinput" \
                KeymouseGo.py
              ls -lh dist/
            '

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: KeymouseGo-UOS-ARM64
          path: dist/KeymouseGo
